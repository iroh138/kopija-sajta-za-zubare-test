# Static preview on GitHub Pages.
# Pages serves static files only, so this build disables booking and /admin (they need the Node server)
# and marks every page noindex. Enable once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Build static preview
        run: npx astro build
        env:
          PUBLIC_PREVIEW_STATIC: '1'
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - name: Acceptance checks
        run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
